name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      # The dependencies as the action installs them: exact versions, hashes checked, wheels only.
      - run: >-
          python -m pip install --disable-pip-version-check --no-deps --require-hashes
          --only-binary :all: -r requirements.txt
      # The lock must satisfy pyproject.toml: nothing more may be needed, and nothing may conflict.
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m pip install pytest pytest-asyncio ruff
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q

  # The reviewer as the action runs it: from the checkout, not installed.
  from-checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-deps --require-hashes
          --only-binary :all: -r requirements.txt
      - run: python -m pip install pytest pytest-asyncio
      - name: Run from another directory, as the action does
        run: |
          cd "$RUNNER_TEMP"
          PYTHONPATH="$GITHUB_WORKSPACE/src" python -P -m zephyr_reviewer --help
      - run: PYTHONPATH="$GITHUB_WORKSPACE/src" python -P -m pytest -q
